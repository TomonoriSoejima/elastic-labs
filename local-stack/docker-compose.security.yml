services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.1}
    container_name: es-local-setup
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      - bash
      - -c
      - >-
        curl -sf -X POST -u elastic:${ELASTIC_PASSWORD:-changeme}
        -H "Content-Type: application/json"
        -d "{\"password\":\"${KIBANA_SYSTEM_PASSWORD:-changeme}\"}"
        http://elasticsearch:9200/_security/user/kibana_system/_password
        && echo "kibana_system password set"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.1}
    container_name: ${ES_CONTAINER_NAME:-es-local-secure}
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - "ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data_secure:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u elastic:${ELASTIC_PASSWORD:-changeme} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.5.1}
    container_name: ${KB_CONTAINER_NAME:-kb-local-secure}
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-changeme}
      - SERVER_PUBLICBASEURL=http://localhost:${KB_PORT:-5602}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${ENCRYPTION_KEY_ESO:-min-32-char-string-for-encryption-key-here-12345}
      - XPACK_REPORTING_ENCRYPTIONKEY=${ENCRYPTION_KEY_REPORTING:-min-32-char-string-for-reporting-key-here-abcde}
      - XPACK_SECURITY_ENCRYPTIONKEY=${ENCRYPTION_KEY_SECURITY:-min-32-char-string-for-security-key-here-fghij}
    ports:
      - "${KB_PORT:-5602}:5601"
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  es_data_secure:
    driver: local

networks:
  elastic:
    driver: bridge
